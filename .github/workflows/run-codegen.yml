name: Codegen

on:
  repository_dispatch:
    types: [codegen]
    
  workflow_dispatch:

  push:
    branches: [main]

jobs:
  get_token:
    name: Fetch app installation token
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.app-token.outputs.token }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.EIN_CODEGEN_APP_ID }}
          private-key: ${{ secrets.EIN_CODEGEN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          skip-token-revoke: true
          repositories: |
            einnsyn-codegen
            einnsyn-api-spec
            einnsyn-sdk-typescript
            einnsyn-sdk-java
            einnsyn-backend
      - run: echo "(DEBUG) Token is ${{ steps.app-token.outputs.token }}"

  execute_codegen:
    name: Execute codegen
    runs-on: ubuntu-latest
    needs: [get_token]

    steps:
      - run: echo "(DEBUG) Token is ${{ needs.get_token.outputs.token }}"

      - name: Checkout codegen repo
        uses: actions/checkout@v4
        with:
          path: "einnsyn-codegen"
  
      - name: Checkout API spec
        uses: actions/checkout@v4
        with:
          repository: felleslosninger/einnsyn-api-spec
          token: ${{ needs.get_token.outputs.token }}
          path: "einnsyn-api-spec"

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Generate new files
        run: |
          bun install @typespec/compiler
          bun install @typespec/openapi3
          bun install ./einnsyn-codegen
          bunx tsp compile ./einnsyn-api-spec/typespec/einnsyn.tsp --emit einnsyn-codegen

  backend:
    name: Run Backend Codegen
    needs: [execute_codegen, get_token]
    if: github.event.client_payload.type == '' || github.event.client_payload.type == 'backend'
    uses: ./.github/workflows/run-codegen-backend.yml
    with:
      token: ${{ needs.get_token.outputs.token }}

  sdk_java:
    name: Run SDK Java Codegen
    needs: [execute_codegen, get_token]
    if: github.event.client_payload.type == '' || github.event.client_payload.type == 'sdk-java'
    uses: ./.github/workflows/run-codegen-sdk-java.yml
    with:
      token: ${{ needs.get_token.outputs.token }}

  sdk_ts:
    name: Run SDK TS Codegen
    needs: [execute_codegen, get_token]
    if: github.event.client_payload.type == '' || github.event.client_payload.type == 'sdk-ts'
    uses: ./.github/workflows/run-codegen-sdk-ts.yml
    with:
      token: ${{ needs.get_token.outputs.token }}
