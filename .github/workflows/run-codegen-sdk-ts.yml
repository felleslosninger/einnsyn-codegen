name: Codegen TypeScript SDK

on:
  workflow_call: 
    inputs:
      token: 
        required: true
        type: string
      commit_message:
        required: false
        type: string

jobs:  
  update_ts_sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout einnsyn-sdk-ts
        uses: actions/checkout@v4
        with:
          repository: felleslosninger/einnsyn-sdk-ts
          token: ${{ inputs.token }}
          path: "einnsyn-sdk-ts"

      - name: Remove old codegen files (with // codegen in first line)
        run: |
          cd einnsyn-sdk-ts
          find . -type f -exec sh -c 'head -n 1 "$0" | grep -q "// Auto-generated"' {} \; -print | xargs -r rm

      - name: Copy new files to backend
        run: |
          cp -r tsp-output/einnsyn-codegen/sdk-ts/* einnsyn-sdk-ts/src/

      - name: Install node
        uses: actions/setup-node@v2
        with:
          node-version: '23'

      - name: Run biome
        run: |
          cd einnsyn-sdk-ts
          mvn spotless:apply

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          path: "einnsyn-sdk-ts"
          title: "EIN-Codegen"
          body: "Automated changes by Codegen."
          commit-message: ${{ inputs.commit_message || 'Codegen' }}
          branch: "codegen"
          sign-commits: true
          token: ${{ inputs.token }}
