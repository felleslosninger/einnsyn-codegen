name: Codegen Backend

on:
  workflow_call: 
    inputs:
      token: 
        required: true
        type: string
      commit_message:
        required: false
        type: string

jobs:  
  update_backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout einnsyn-backend
        uses: actions/checkout@v4
        with:
          repository: felleslosninger/einnsyn-backend
          token: ${{ inputs.token }}
          path: "einnsyn-backend"

      - name: Remove old codegen files (with // codegen in first line)
        run: |
          cd einnsyn-backend
          find . -type f -exec sh -c 'head -n 1 "$0" | grep -q "// Auto-generated"' {} \; -print | xargs -r rm

      - name: Copy new files to backend
        run: |
          cp -r tsp-output/einnsyn-codegen/no/einnsyn/backend/* einnsyn-backend/src/main/java/no/einnsyn/backend/

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "adopt"

      - name: Run spotless
        run: |
          cd einnsyn-backend
          mvn spotless:apply

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          path: "einnsyn-backend"
          title: "EIN-Codegen"
          body: "Automated changes by Codegen."
          commit-message: ${{ inputs.commit_message || 'Codegen' }}
          branch: "codegen"
          sign-commits: true
          token: ${{ inputs.token }}
