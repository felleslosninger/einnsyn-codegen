name: 'TypeScript SDK Codegen'
description: 'Codegen for eInnsyn TypeScript SDK'

inputs:
  token:
    description: 'GitHub token for repository access'
    required: true
  commit_message:
    description: 'Commit message for the pull request'
    required: false
    default: 'Codegen'

runs:  
  using: "composite"
  steps:
    - name: Checkout einnsyn-sdk-ts
      uses: actions/checkout@v4
      with:
        repository: felleslosninger/einnsyn-sdk-ts
        token: ${{ inputs.token }}
        path: "einnsyn-sdk-ts"

    - name: Remove old codegen files (with // codegen in first line)
      shell: bash
      run: |
        cd einnsyn-sdk-ts
        find . -type f -exec sh -c 'head -n 1 "$0" | grep -q "// Auto-generated"' {} \; -print | xargs -r rm

    - name: Copy new files to backend
      shell: bash
      run: |
        cp -r tsp-output/einnsyn-codegen/sdk-ts/* einnsyn-sdk-ts/src/

    - name: Install node
      uses: actions/setup-node@v2
      with:
        node-version: '23'

    - name: Run biome
      shell: bash
      run: |
        cd einnsyn-sdk-ts
        mvn spotless:apply

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        path: "einnsyn-sdk-ts"
        title: "EIN-Codegen"
        body: "Automated changes by Codegen."
        commit-message: ${{ inputs.commit_message || 'Codegen' }}
        branch: "codegen"
        sign-commits: true
        token: ${{ inputs.token }}
