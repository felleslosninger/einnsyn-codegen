name: 'Java SDK Codegen'
description: 'Codegen for eInnsyn Java SDK'

inputs:
  token:
    description: 'GitHub token for repository access'
    required: true
  pr_body:
    description: 'Message body for the pull request'
    required: false
    default: 'Automated changes by Codegen.'
  pr_title:
    description: 'Title for the pull request'
    required: false
    default: 'codegen'

runs:
  using: "composite"
  steps:
    - name: Checkout einnsyn-sdk-java
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: felleslosninger/einnsyn-sdk-java
        token: ${{ inputs.token }}
        path: "einnsyn-sdk-java"

    - name: Remove old codegen files (with // codegen in first line)
      shell: bash
      run: |
        cd einnsyn-sdk-java
        find . -type f -exec sh -c 'head -n 1 "$0" | grep -q "// Auto-generated"' {} \; -print | xargs -r rm

    - name: Copy new files
      shell: bash
      run: |
        cp -r tsp-output/einnsyn-codegen/no/einnsyn/sdk/* einnsyn-sdk-java/src/main/java/no/einnsyn/sdk/

    - name: Install Java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: 21
        distribution: "adopt"

    - name: Run spotless
      shell: bash
      run: |
        cd einnsyn-sdk-java
        mvn spotless:apply

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        path: "einnsyn-sdk-java"
        title: ${{ inputs.pr_title }}
        body: ${{ inputs.pr_body }}
        commit-message: ${{ inputs.pr_title }}
        branch: "codegen"
        sign-commits: true
        token: ${{ inputs.token }}
