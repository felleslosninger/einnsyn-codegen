name: 'TypeScript SDK Codegen'
description: 'Codegen for eInnsyn TypeScript SDK'

inputs:
  token:
    description: 'GitHub token for repository access'
    required: true
  pr_body:
    description: 'Message body for the pull request'
    required: false
    default: 'Automated changes by Codegen.'
  pr_title:
    description: 'Title for the pull request'
    required: false
    default: 'codegen'

runs:  
  using: "composite"
  steps:
    - name: Checkout einnsyn-sdk-typescript
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: felleslosninger/einnsyn-sdk-typescript
        token: ${{ inputs.token }}
        path: "einnsyn-sdk-typescript"

    - name: Remove old codegen files (with // codegen in first line)
      shell: bash
      run: |
        cd einnsyn-sdk-typescript
        find . -type f -exec sh -c 'head -n 1 "$0" | grep -q "// Auto-generated"' {} \; -print | xargs -r rm

    - name: Copy new files to backend
      shell: bash
      run: |
        cp -r tsp-output/einnsyn-codegen/sdk-typescript/* einnsyn-sdk-typescript/src/

    - name: Install node
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: '22'

    - name: Install dependencies
      shell: bash
      run: |
        cd einnsyn-sdk-typescript
        npm ci --ignore-scripts

    - name: Run lint fix
      shell: bash
      run: |
        cd einnsyn-sdk-typescript
        npm run lint:fix

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        path: "einnsyn-sdk-typescript"
        title: ${{ inputs.pr_title }}
        body: ${{ inputs.pr_body }}
        commit-message: ${{ inputs.pr_title }}
        branch: "codegen"
        sign-commits: true
        token: ${{ inputs.token }}
